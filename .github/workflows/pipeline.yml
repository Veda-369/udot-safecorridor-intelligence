name: Refresh UDOT SafeCorridor analytics

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday refresh. GitHub Actions cron uses UTC.
    - cron: "17 10 * * 1"

permissions:
  contents: write

concurrency:
  group: udot-analytics-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore incremental data cache
        uses: actions/cache@v5
        with:
          path: |
            data/cache
            data/reference
          # Unique save key + broad restore prefix restores the newest successful
          # cache and saves a new immutable cache after this run succeeds.
          key: udot-data-cache-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            udot-data-cache-v2-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run completed-year historical pipeline
        env:
          UDOT_CRASH_MIN_YEAR: "2018"
          UDOT_INCREMENTAL_REFRESH: "true"
          UDOT_CURRENT_RECONCILIATION_DAYS: "60"
          UDOT_CURRENT_FULL_RECONCILIATION_DAYS: "30"
          UDOT_HISTORICAL_RECENT_RECONCILIATION_DAYS: "30"
          UDOT_HISTORICAL_ARCHIVE_RECONCILIATION_DAYS: "180"
        run: python -m src.pipeline

      - name: Screen candidate routes
        run: python phase2a_screen.py

      - name: Spatially reference crashes and build corridor bins
        run: python phase2b_spatial.py

      - name: Run statistical corridor validation
        run: python phase2c_statistical.py

      - name: Consolidate executive priority corridors
        run: python phase2d_executive_corridors.py

      - name: Build corridor driver analysis
        run: python phase3_driver_analysis.py

      - name: Build historical statewide explorer datasets
        run: python phase3b_statewide_explorer.py

      # Publish valid historical outputs before the optional/current-year monitor.
      # If the YTD monitor later fails, the historical refresh is still preserved.
      - name: Commit refreshed historical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold reports

          if git diff --cached --quiet; then
            echo "No historical published-output changes."
          else
            git commit -m "data: refresh historical UDOT analytical outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build dynamic current-year YTD monitor
        env:
          UDOT_INCREMENTAL_REFRESH: "true"
          UDOT_CURRENT_RECONCILIATION_DAYS: "60"
          UDOT_CURRENT_FULL_RECONCILIATION_DAYS: "30"
        run: python phase3c_current_year_monitor.py

      - name: Commit refreshed current-year outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/gold/current_year_crashes.parquet \
            data/gold/current_year_county_summary.parquet \
            data/gold/current_year_route_summary.parquet \
            data/gold/current_year_ytd_comparison.parquet \
            data/gold/current_year_monthly_trend.parquet \
            reports/phase3c_current_year_monitor.json \
            reports/incremental_current_refresh.json

          if git diff --cached --quiet; then
            echo "No current-year published-output changes."
          else
            git commit -m "data: refresh current-year UDOT monitor"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
